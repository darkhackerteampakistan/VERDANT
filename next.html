<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdant — Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f1e8;--paper:#fbfaf4;--ink:#2d3a24;--muted:#6b7a5c;--green:#4a6b3a;--green-soft:#e8efdd;--gold:#c9a44b;--line:#ddd8c5;}
  html,body{height:100%;margin:0;}
  body{font-family:'Karla',sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;letter-spacing:0.005em;}
  .card{text-align:center;padding:60px 48px;max-width:460px;width:92%;background:var(--paper);border-radius:28px;box-shadow:0 30px 70px rgba(45,58,36,0.10);}
  .ring{width:100px;height:100px;margin:0 auto 28px;border-radius:50%;background:linear-gradient(145deg,#8aa87c,#4a6b3a);color:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 36px rgba(74,107,58,0.35);animation:pop .6s cubic-bezier(0.2,0.9,0.3,1.2);}
  .ring svg{width:48px;height:48px;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}65%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  h2{font-family:'Cormorant',serif;font-size:42px;font-weight:500;letter-spacing:-0.02em;margin:0 0 14px;}
  h2 em{font-style:italic;color:var(--green);}
  p{font-size:15.5px;color:var(--muted);line-height:1.65;margin:0;}
  .stamp{margin-top:32px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:24px;font-family:'Cormorant',serif;font-style:italic;font-size:16px;color:var(--green);}
</style>
</head>
<body>
  <div class="card">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>Order <em>verified</em>.</h2>
    <p>Your basket is being prepared. Redirecting you now…</p>
    <div class="stamp"><span>Fresh</span><span>Local</span><span>Organic</span></div>
  </div>
  <script>
    setTimeout(function(){
      var d=new URLSearchParams(location.search).get("to");
      location.href=d||"https://www.google.com";
    },1800);
  </script>
</body>
</html>
